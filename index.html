<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nevil — Digital Business Card</title>
<style>
  :root {
    --bg: #0a0a0c;
    --card: #141416;
    --border: rgba(255,255,255,0.08);
    --text: #f5f5f7;
    --muted: #a1a1aa;
    --accent: #c9a227;
    --accent-glow: rgba(201, 162, 39, 0.25);
    --radius: 28px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(201,162,39,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(100,100,255,0.06) 0%, transparent 50%);
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px 28px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03) inset;
  }
  .avatar {
    width: 88px; height: 88px; border-radius: 50%;
    background: linear-gradient(145deg, #2a2a30, #1a1a1e);
    border: 2px solid rgba(201,162,39,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 600; letter-spacing: -0.5px;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  h1 { font-size: 28px; font-weight: 650; letter-spacing: -0.6px; margin-bottom: 4px; }
  .title { color: var(--accent); font-size: 15px; font-weight: 500; letter-spacing: 0.3px; margin-bottom: 14px; }
  .bio { color: var(--muted); font-size: 15px; line-height: 1.5; margin-bottom: 28px; }
  .save-btn {
    width: 100%;
    background: linear-gradient(180deg, #e0b84a 0%, var(--accent) 100%);
    color: #111; border: none; border-radius: 16px; padding: 16px;
    font-size: 16.5px; font-weight: 600; letter-spacing: -0.2px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 8px 20px var(--accent-glow), 0 1px 0 rgba(255,255,255,0.3) inset;
  }
  .save-btn:active { transform: scale(0.98); }
  .phone-row {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    border-radius: 16px; padding: 14px 16px; margin: 18px 0 26px;
  }
  .phone-row a { color: var(--text); text-decoration: none; font-weight: 550; font-size: 16px; }
  .phone-row span { color: var(--muted); font-size: 13px; }
  .links { display: flex; flex-direction: column; gap: 10px; }
  .link {
    display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px;
    text-decoration: none; color: var(--text); font-size: 15.5px; font-weight: 500;
  }
  .link:active { background: rgba(255,255,255,0.07); border-color: rgba(201,162,39,0.3); }
  .link-icon {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; background: rgba(255,255,255,0.06); flex-shrink: 0;
  }
  .footer { text-align: center; margin-top: 28px; color: #555; font-size: 12px; letter-spacing: 0.4px; }
</style>
</head>
<body>
<div class="card">
  <div class="avatar">N</div>
  <h1>Nevil</h1>
  <div class="title">Professional</div>
  <p class="bio">Connect with me below.</p>

  <button class="save-btn" id="saveBtn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
      <polyline points="17 21 17 13 7 13 7 21"/>
      <polyline points="7 3 7 8 15 8"/>
    </svg>
    Save Contact
  </button>

  <div class="phone-row">
    <a href="tel:+917486009351">+917486009351</a>
    <span>Tap to call</span>
  </div>

  <div class="links">
    
    <a class="link" href="https://www.instagram.com/nevil_8055?vrfl=MXFxc2w5eHE2ZGliZQ%3D%3D&utm_source=qr" target="_blank">
      <div class="link-icon">📸</div>
      Instagram
    </a>
    <a class="link" href="https://wa.me/917486009351" target="_blank">
      <div class="link-icon">💬</div>
      WhatsApp
    </a>
  </div>

  <div class="footer">Digital Card</div>
</div>

<script>
const CARD = {
  name: "Nevil",
  phone: "+917486009351",
  phoneDisplay: "+917486009351",
  cardUrl: window.location.href
};

document.getElementById('saveBtn').addEventListener('click', () => {
  const vcard = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'FN:' + CARD.name,
    'N:' + CARD.name + ';;;',
    'TEL;TYPE=CELL:' + CARD.phone,
    'URL:' + CARD.cardUrl,
    'NOTE:Digital business card — ' + CARD.cardUrl,
    'END:VCARD'
  ].join('\r\n');

  const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = CARD.name.replace(/\s+/g, '_') + '.vcf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
